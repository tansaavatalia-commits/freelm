[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genesis-drop-engine"
version = "0.1.0"
description = "GENESIS DROP ENGINE - private dropshipping operating system"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a PostgreSQL database (GENESIS_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/genesis"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["genesis"]
branch = true

[tool.importlinter]
root_package = "genesis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not depend on infrastructure"
type = "forbidden"
source_modules = ["genesis.core", "genesis.policy", "genesis.modules.profit.domain"]
forbidden_modules = ["genesis.platform", "sqlalchemy", "psycopg", "alembic"]

[[tool.importlinter.contracts]]
name = "Core depends on nothing internal"
type = "forbidden"
source_modules = ["genesis.core"]
forbidden_modules = ["genesis.policy", "genesis.modules", "genesis.platform"]
