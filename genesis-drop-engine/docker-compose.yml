# Local development database. Bound to localhost only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis   # local dev only; never reuse in production
      POSTGRES_DB: genesis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - genesis_pg:/var/lib/postgresql/data
volumes:
  genesis_pg:
