[project]
name = "yt-factory"
version = "0.1.0"
description = "Fabbrica multi-agente di canali YouTube su LLM gratuiti (freelm)"
requires-python = ">=3.11"
dependencies = ["freelm>=0.6", "httpx>=0.27", "edge-tts>=7.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
