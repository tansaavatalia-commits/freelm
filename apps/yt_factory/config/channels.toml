# yt_factory — configurazione canali e calendario.
# Modifica liberamente: nicchie, voci, orari. Le chiavi segrete NON vanno qui (usa variabili d'ambiente).

[global]
timezone = "Europe/Rome"
videos_per_day = 3                       # Shorts al giorno PER CANALE
publish_slots = ["12:30", "18:00", "21:00"]  # orari di pubblicazione (fuso sopra), uno per video
weekly_long_video = true                 # + 1 video lungo orizzontale a settimana per canale
long_video_weekday = 6                   # 0=lunedì ... 6=domenica
long_video_slot = "17:00"
# "schedule" = carica privato con data di pubblicazione programmata (consigliato)
# "public"   = pubblica subito;  "private" = resta privato (revisione manuale in YouTube Studio)
privacy_mode = "schedule"
llm_model = "chat"                       # alias freelm: chat | large | fast | auto
panel_models = ["chat", "large", "fast"] # giuria del pubblico: modelli diversi = giudizi indipendenti
max_parallel_videos = 3                  # video in produzione contemporaneamente (per canale)
max_parallel_renders = 2                 # render ffmpeg simultanei (tutto il sistema)
min_quality_score = 7                    # 0-10: sotto questa soglia lo script viene riscritto
max_rewrites = 2
upload_quota_cost = 1600                 # unità quota YouTube per upload (stima prudente)
daily_quota = 10000                      # quota giornaliera del progetto Google Cloud
ai_images = true                         # immagini AI per scena (Pollinations, gratis, senza chiave)
shot_seconds = 2.8                       # durata massima di un'inquadratura: tagli frequenti = più ritenzione

# ---------------------------------------------------------------------------
[[channel]]
id = "fatti"
name = "Fatti Pazzeschi"
language = "it"
region = "IT"
voice = "it-IT-DiegoNeural"
niche = "curiosità incredibili ma vere: scienza, corpo umano, storia, psicologia, animali"
audience = "italiani 16-40 anni che scorrono gli Shorts e amano dire 'non lo sapevo!'"
style = "ritmo veloce, tono stupito ma credibile, un fatto verificabile per video, chiusura che invita a commentare"
visual_style = "vivid cinematic photography, high contrast, shallow depth of field, editorial science magazine look"
keywords = ["curiosità", "lo sapevi", "fatti incredibili", "psicologia", "scienza"]
category_id = "27"                       # Education
palette = ["#0b1020", "#1e3a8a", "#facc15"]  # sfondo, sfondo 2, accento
seed_channel_ids = []                    # ID di canali da studiare via RSS (UC...)
affiliate_links = []                     # es. ["Libro consigliato: https://amzn.to/..."]

[[channel]]
