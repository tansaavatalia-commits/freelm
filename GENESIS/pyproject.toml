[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-platform"
dynamic = ["version"]
description = "GÉNESIS - extensible intelligence platform (headless core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # Phase 1 runs on the standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
genesis = "genesis.cli:main"

[tool.setuptools.dynamic]
version = { attr = "genesis.__version__" }

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Same pinned rule set as the rest of the repository.
select = ["E4", "E7", "E9", "F", "I"]
