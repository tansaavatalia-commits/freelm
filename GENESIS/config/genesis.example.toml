# Esempio di configurazione di GÉNESIS.
# Copialo come "genesis.toml" nella cartella dati (genesis status mostra quale),
# non nel repository. Tutte le chiavi sono facoltative.

[general]
# auto | lite-4gb | standard | gpu
# Un profilo più potente di quanto supporti l'hardware viene ignorato.
profile = "auto"

[logging]
# DEBUG | INFO | WARNING | ERROR
level = "INFO"

[backup]
# Quanti backup conservare (predefinito: dipende dal profilo).
# keep = 7

[permissions.grants]
# Livello massimo (0-5) per ogni principal. I livelli 4 e 5 richiedono
# comunque l'approvazione del proprietario per ogni singola azione.
# owner = 5
# system = 3
# "agent.developer" = 2   # esempio: permette al Developer di scrivere file nella cartella di lavoro

[intelligence]
# Motore online: OpenRouter, solo modelli gratuiti. Più semplice: genesis online enable --confirm
# remote_enabled = true
# remote_free_verified = true

[tools]
# Strumento web.fetch (pagine pubbliche; indirizzi locali/privati sempre rifiutati)
# internet_enabled = true

# Server MCP (stdio). Il programma viene avviato solo per la durata di una richiesta.
# level: 3 (esecuzione) predefinito; 4-5 richiedono un'approvazione per ogni chiamata.
# [mcp.servers.esempio]
# command = ["py", "-3", "C:/percorso/server.py"]
# level = 3
# timeout = 30
