# Fabbrica YouTube: ogni giorno produce (e, se abilitato, programma) i video di tutti i canali.
# Attivazione: Settings > Secrets and variables > Actions (vedi apps/yt_factory/README.md, passo 5).
name: yt-factory

on:
  schedule:
    - cron: "17 5 * * *"        # ogni giorno alle 05:17 UTC (06:17/07:17 in Italia): video pronti prima degli slot
  # prova su un branch di sviluppo: parte solo se il messaggio del commit contiene [run-studio]
  push:
    branches: ["claude/**"]
    paths: ["apps/yt_factory/**", ".github/workflows/yt-factory.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Caricare su YouTube? (false = solo produzione, video scaricabili dagli artifact)"
        type: boolean
        default: false
      count:
        description: "Shorts per canale (vuoto = videos_per_day)"
        required: false
      long:
        description: "Produrre anche il video lungo oggi"
        type: boolean
        default: false

concurrency:
  group: yt-factory
  cancel-in-progress: false

permissions:
  contents: read
  models: read          # GitHub Models: LLM gratuiti col token automatico del repository

jobs:
  produce:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-studio]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: apps/yt_factory
    env:
      # LLM gratuiti (più chiavi = più capacità e failover)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # notifiche: video e riepilogo sul telefono
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # dati e media
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      # pubblicazione
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_FATTI: ${{ secrets.YT_REFRESH_TOKEN_FATTI }}
      YT_REFRESH_TOKEN_MONEY: ${{ secrets.YT_REFRESH_TOKEN_MONEY }}
      YT_REFRESH_TOKEN_MYSTERIES: ${{ secrets.YT_REFRESH_TOKEN_MYSTERIES }}
      YTF_DATA_DIR: ${{ github.workspace }}/apps/yt_factory/data
      # le prove su branch hanno una memoria separata da quella di produzione
      DB_CACHE: ${{ github.event_name == 'push' && 'ytf-test-db' || 'ytf-db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg + font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-inter
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/yt_factory/motion/package-lock.json
      - name: Grafiche animate (Remotion)
        working-directory: apps/yt_factory/motion
        run: npm ci --no-audit --no-fund
      - name: Dipendenze
        run: pip install -e ../.. -r requirements.txt
      - name: Controllo GitHub Models (diagnosi)
        continue-on-error: true
        run: |
          BODY='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the single word PINEAPPLE"}],"max_tokens":8}'
          for v in plain headers azure; do
            case $v in
              plain)   URL=https://models.github.ai/inference/chat/completions; EXTRA=() ;;
              headers) URL=https://models.github.ai/inference/chat/completions
                       EXTRA=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28") ;;
              azure)   URL=https://models.inference.ai.azure.com/chat/completions; EXTRA=() ;;
            esac
            B=$BODY; [ $v = azure ] && B=${BODY/openai\/gpt-4.1-mini/gpt-4o-mini}
            echo "== $v"
            curl -sS -m 60 -D /tmp/h.txt -o /tmp/ghm.json -w "HTTP %{http_code}\n" "$URL" "${EXTRA[@]}" \
              -H "Authorization: Bearer $GITHUB_MODELS_TOKEN" -H "Content-Type: application/json" -d "$B" || true
            grep -i "^content-type" /tmp/h.txt || true
            head -c 300 /tmp/ghm.json; echo
          done
      - name: Ripristina memoria della fabbrica (storico video, apprendimenti, quota)
        if: github.event_name != 'push'          # le prove su branch partono sempre da zero
        uses: actions/cache/restore@v4
        with:
          path: apps/yt_factory/data/factory.sqlite
          key: ${{ env.DB_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.DB_CACHE }}-
      - name: Produci (e pubblica)
        if: ${{ !contains(github.event.head_commit.message, '[diag-only]') }}   # [diag-only]: solo i controlli
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.YTF_PUBLISH }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          if [ -n "${{ inputs.count }}" ]; then ARGS="$ARGS --count ${{ inputs.count }}"; fi
          if [ "${{ inputs.long }}" = "true" ]; then ARGS="$ARGS --long"; fi
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="--count 1"; fi   # prova: 1 Short per canale, mai pubblicato
          python -m yt_factory run $ARGS
      - name: Salva memoria della fabbrica
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: apps/yt_factory/data/factory.sqlite
          key: ${{ env.DB_CACHE }}-${{ github.run_id }}
      - name: Video e report (scaricabili per 7 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            apps/yt_factory/data/videos/
            apps/yt_factory/data/reports/
          retention-days: 7
          if-no-files-found: ignore
