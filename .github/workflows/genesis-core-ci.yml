name: genesis-core-ci

# GÉNESIS core: lint + tests on Linux and on Windows (the owner's PC runs Windows 10).
# Standard runners are free on public repositories. Path-filtered: freelm-only
# changes do not run it, and it never touches freelm's own workflows.
on:
  push:
    paths: ["GENESIS/**", ".github/workflows/genesis-core-ci.yml"]
  pull_request:
    paths: ["GENESIS/**", ".github/workflows/genesis-core-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: GENESIS
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install test tools (GENESIS itself has no runtime dependencies)
        run: uv pip install "pytest>=7" "ruff>=0.4"
      - name: Install freelm from this repository (online-engine integration test)
        run: uv pip install -e ..
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Smoke test with real hardware detection
        run: python -m genesis --home "$RUNNER_TEMP/genesis-home" doctor

  frontend:
    # The built interface is committed (genesis/api/static) so the owner's PC needs no Node.
    # This job proves the committed build matches the sources.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GENESIS/desktop/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Committed build is up to date
        run: git diff --exit-code -- ../../genesis/api/static || (echo "Run 'npm run build' in GENESIS/desktop/frontend and commit genesis/api/static" && exit 1)
