# Bot de trading en PAPEL sobre GitHub Actions (gratis).
# - cada hora: procesa la última vela cerrada (live --once)
# - cada día a las 03:xx UTC: además, una ronda de mejora automática (optimize)
# La memoria se guarda en la rama `trading-state`.
#
# IMPORTANTE: GitHub solo ejecuta los `schedule` desde la rama por defecto (main).
# Este workflow NUNCA opera con dinero real: para eso, ver deploy/oracle-setup.sh.
name: trading-bot (papel)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      optimize:
        description: "Ejecutar también una ronda de optimización"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # claves gratuitas opcionales para el analista IA (Settings > Secrets > Actions)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOT: examples/trading_agents/bot.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -q -e .
      - name: Recuperar memoria
        run: examples/trading_agents/deploy/gh_state.sh load state
      - name: Procesar la última vela (papel)
        run: python "$BOT" live --once --dir state --exchange papel --llm
      - name: Ronda diaria de mejora
        run: |
          if [ "${{ inputs.optimize }}" = "true" ] || [ "$(date -u +%H)" = "03" ]; then
            python "$BOT" optimize --source binance --limit 5000 --dir state --population 10 --generations 5
          fi
      - name: Informe
        run: |
          python "$BOT" gate --dir state || true
          python "$BOT" status --source binance --dir state | head -20 || true
      - name: Guardar memoria
        if: always()
        run: examples/trading_agents/deploy/gh_state.sh save state
