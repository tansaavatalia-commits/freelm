# Momentum combinado en PAPEL durante 20 días, en GitHub Actions (gratis).
# NUNCA opera con dinero real ni se conecta a ninguna cuenta.
#
#   cada día a las 00:17 UTC -> procesa la vela diaria recién cerrada (bot.py momentum)
#                               y registra las señales del día (bot.py senales --record)
#   siempre                  -> informe en el resumen de la ejecución y, si está
#                               configurado, un aviso por Telegram
#
# La memoria vive en la rama `momentum-state`. Cuando se completan los 20 días,
# el comando solo informa (no sigue operando en papel).
#
# Secrets opcionales: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID.
name: momentum (papel, 20 días)

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT: examples/trading_agents/bot.py
      STATE_BRANCH: momentum-state
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Instalar
        run: uv pip install -e . ccxt
      - name: Recuperar memoria
        run: examples/trading_agents/deploy/gh_state.sh load state
      - name: Procesar el día (papel)
        run: python "$BOT" momentum --dir state
      # cada señal se registra y se puntúa días después, se opere o no (tarjeta de aciertos)
      - name: Registrar las señales del día
        run: python "$BOT" senales --record --no-history --limit 260 --dir state
      - name: Informe
        if: always()
        run: |
          {
            echo '## Momentum combinado en papel'
            echo '```'
            python "$BOT" momentum --dir state --report || true
            python "$BOT" senales --live-only --dir state || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar memoria
        if: always()
        run: examples/trading_agents/deploy/gh_state.sh save state
